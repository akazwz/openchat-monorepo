# The system Python's own pip configuration (/usr/pip.conf: pip reads
# pip.conf in its interpreter's prefix). Only /workspace outlives a restart,
# so a plain `pip install` goes to the user's directory, /workspace/.local
# (PYTHONUSERBASE), as `pip install --user` does; into /usr/local it was lost
# at the next restart. A virtual environment has a prefix of its own and does
# not read this file: pip there installs into the environment, as usual (pip
# refuses --user in one).
[install]
user = true
# Debian keeps the system's Python to its own packages (PEP 668); in a
# computer that is the agent's alone, pip installs beside them.
break-system-packages = true
