name: heveta

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: heveta
      POSTGRES_PASSWORD: password_123456
      POSTGRES_DB: heveta
    ports:
      - "127.0.0.1:55437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heveta -d heveta"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
